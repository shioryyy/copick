name: Tauri packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tauri.yml'
      - 'app/**'
  push:
    branches: [main]
    # 打 v* 标签时走同一条构建，再由下面的 release job 建 GitHub Release。
    tags: ['v*']
    paths:
      - '.github/workflows/tauri.yml'
      - 'app/**'

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Tauri ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
            platform: darwin
            arch: arm64
            artifact: copick-mac-arm64
          - os: windows-latest
            label: Windows x64 MSVC
            platform: win32
            arch: x64
            artifact: copick-win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify native runner architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture; native packaging is required')"

      - name: Enable MSVC x64 compiler for native tests and build
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm --prefix app ci

      - name: Test Tauri
        run: npm --prefix app test

      # 与 Electron 版共用同一组仓库密钥：存在证书时签名，存在 App Store Connect
      # 凭据时同时公证；两者都没有时保持和以前一致的 ad-hoc 签名，绝不半途失败。
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MAC_CSC_LINK:-}" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'macOS: no MAC_CSC_LINK secret; building with ad-hoc signing, not notarized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "APPLE_CERTIFICATE=$MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          # 未指定身份时由 tauri 从导入的证书里选 Developer ID Application。
          if [[ -n "${MAC_SIGNING_IDENTITY:-}" ]]; then
            echo "APPLE_SIGNING_IDENTITY=$MAC_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo 'macOS: Developer ID signing with notarization.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'macOS: Developer ID signing without notarization (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID missing).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build native app or NSIS installer
        run: npm --prefix app run build

      # 有证书时签名，没有时保持未签名，绝不半途失败。
      - name: Sign Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK) {
            'Windows: no WIN_CSC_LINK secret; artifacts are unsigned.' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'copick-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          $targets = @(Get-ChildItem 'app/src-tauri/target/release/copick.exe')
          $targets += @(Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*.exe')
          foreach ($file in $targets) {
            & $signtool.FullName sign /f $pfx /p $env:WIN_CSC_KEY_PASSWORD /fd sha256 /td sha256 `
              /tr http://timestamp.digicert.com $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.FullName)" }
          }
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($file.FullName): $($signature.Status)" }
          }
          Remove-Item $pfx -Force
          "Windows: signed $($targets.Count) artifacts." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Smoke test actual binary and package release artifacts
        run: npm --prefix app run package

      # 安装包是用户拿到的第一件东西，而 smoke test 只证明构建产物能启动，
      # 不证明它装得上。这里静默安装到临时目录、点一次开机自启开关、覆盖安装、再卸载。
      # 需要交互桌面：产品启动要建 WebView2，GitHub 的 Windows runner 是交互会话，可直接跑。
      - name: Install, launch-at-login, upgrade and uninstall checks (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & app/scripts/verify-windows-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer verification failed ($LASTEXITCODE)" }
          Get-Content app/artifacts/installer-verification.json -Raw | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Record signing status
        shell: bash
        run: |
          echo 'Signature state is recorded by the steps above; empty secrets mean unsigned (macOS ad-hoc) builds.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows portable ZIP requires system Microsoft Edge WebView2 Runtime. NSIS downloads it when needed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows installer checks cover silent install, the launch-at-login toggle, reinstalling over an existing install, and uninstall.' >> "$GITHUB_STEP_SUMMARY"
          echo 'macOS installation and accessibility permission checks remain manual.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: app/artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  # 推 v* 标签时把两个平台的产物合成一个 GitHub Release。标签只是触发器，
  # 版本号仍以 tauri.conf.json 为准，两者对不上就直接失败，免得挂错版本。
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 tauri.conf.json 的版本 ${version} 不一致" >&2
            exit 1
          fi

      - name: Download both platform packages
        uses: actions/download-artifact@v7
        with:
          pattern: copick-*
          path: packages

      # 两个平台各有自己的 SHA256SUMS.txt，合并成一份再逐个校验，避免同名文件互相覆盖。
      - name: Collect assets and verify checksums
        run: |
          set -euo pipefail
          mkdir release
          find packages -maxdepth 2 -type f ! -name SHA256SUMS.txt -exec cp {} release/ \;
          cat packages/*/SHA256SUMS.txt | sort -k 2 > release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
