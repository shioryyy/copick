name: Release

on:
  push:
    tags: ['v*']
  # Manual dry run: builds, verifies and produces checksums without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  # Tauri 版本与 Electron 版本一起构建。默认不把 Tauri 包挂到 Release 上——
  # 需要仓库变量 COPICK_PUBLISH_TAURI=true；此时它的产物属于发布内容，失败必须拦住发布。
  tauri:
    uses: ./.github/workflows/tauri.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [build, tauri]
    # 默认发布的是 Electron 版，Tauri 只是旁路构建：它失败时仍然发布 Electron 版，
    # 否则一个尚未真机验证的重构版能单独卡死正式发布。
    # 反过来，一旦开启 COPICK_PUBLISH_TAURI，Tauri 产物就是发布内容的一部分，必须成功。
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.tauri.result == 'success' || vars.COPICK_PUBLISH_TAURI != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./app/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$pkg" ]]; then
              echo "::error::tag v$tag does not match app/package.json version $pkg"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          prerelease=false; [[ "$pkg" == *-* ]] && prerelease=true
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$pkg prerelease=$prerelease publish=$(grep publish= "$GITHUB_OUTPUT" | tail -1)"

      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_TAURI: ${{ vars.COPICK_PUBLISH_TAURI }}
        run: |
          set -euo pipefail
          # Section starts at "## [VERSION]" and ends before the next "## [".
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          {
            echo "## Copick v$VERSION"
            echo
            cat notes.md
            echo
            echo "### 安装"
            echo
            echo "- **macOS Apple Silicon（arm64）**：下载 \`Copick-$VERSION-mac-arm64.zip\`，解压后将 Copick.app 拖入「应用程序」，在「系统设置 → 隐私与安全性 → 辅助功能」允许 Copick。此包未签名、未公证，系统可能阻止首次启动。"
            echo "- **Windows 11 x64 安装版**：下载 \`Copick-Setup-$VERSION-win-x64.exe\` 运行，按用户安装、不需要管理员权限，可在设置中开启开机自启。未代码签名，会出现 SmartScreen 提示，点「更多信息 → 仍要运行」。"
            echo "- **Windows 11 x64 便携版**：下载 \`Copick-$VERSION-win-x64.zip\`，完整解压到固定目录后运行 \`Copick.exe\`。不能仅复制 EXE；移动目录后需重新开启开机自启。"
            echo "- 系统要求：macOS 13+（Apple Silicon）或 Windows 11 x64。"
            echo "- 更新前请从托盘退出旧版。\`SHA256SUMS.txt\` 提供全部附件的 SHA-256 校验值。"
            echo "- 兼容性实测结果见 [docs/COMPATIBILITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/docs/COMPATIBILITY.md)。"
            if [[ "${PUBLISH_TAURI:-false}" == "true" ]]; then
              echo
              echo "### Tauri 重构版（预览）"
              echo
              echo "- 同一 tag 还会附上 \`Copick-Tauri-$VERSION-mac-arm64.zip\`、\`Copick-Tauri-$VERSION-win-x64.zip\` 与 \`Copick-Tauri-Setup-$VERSION-win-x64.exe\`。这是 Rust + Tauri 的重写版本，功能对齐中，遇到问题请优先回退到上面的 Electron 版本。"
              echo "- 两个版本使用不同的配置目录，可以并存安装；同时运行时只有一个能抢到托盘与取词钩子。"
            fi
          } > release-body.md
          cat release-body.md

      - uses: actions/download-artifact@v7
        with:
          pattern: copick-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts and write checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_TAURI: ${{ vars.COPICK_PUBLISH_TAURI }}
          TAURI_RESULT: ${{ needs.tauri.result }}
        run: |
          set -euo pipefail
          # 走到了这里说明 Tauri 失败没有拦住发布（未开启 COPICK_PUBLISH_TAURI），
          # 但要让维护者一眼看到重构版这次没通过，而不是无声无息。
          if [[ "$TAURI_RESULT" != "success" ]]; then
            echo "::warning::Tauri 构建结果为 $TAURI_RESULT，本次只发布 Electron 版"
            echo "Tauri 构建结果为 \`$TAURI_RESULT\`，本次 Release 只包含 Electron 产物。" >> "$GITHUB_STEP_SUMMARY"
          fi
          cd dist
          rm -f *.yml *.yaml *.blockmap
          ls -la
          for name in "Copick-$VERSION-mac-arm64.zip" "Copick-$VERSION-win-x64.zip" "Copick-Setup-$VERSION-win-x64.exe"; do
            [[ -f "$name" ]] || { echo "::error::missing $name"; exit 1; }
          done
          # Tauri 包默认只留在 Actions 产物里：仓库变量 COPICK_PUBLISH_TAURI=true 才挂到 Release。
          if [[ "${PUBLISH_TAURI:-false}" == "true" ]]; then
            for name in "Copick-Tauri-$VERSION-mac-arm64.zip" "Copick-Tauri-$VERSION-win-x64.zip" "Copick-Tauri-Setup-$VERSION-win-x64.exe"; do
              [[ -f "$name" ]] || { echo "::error::missing $name"; exit 1; }
            done
          else
            rm -f Copick-Tauri-*
            echo 'Tauri packages are not attached to the Release; set repository variable COPICK_PUBLISH_TAURI=true to include them.' >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "Copick v$VERSION" --notes-file release-body.md --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists; delete it or bump the version"
            exit 1
          fi
          gh release create "v$VERSION" "${flags[@]}" dist/*.zip dist/*.exe dist/SHA256SUMS.txt
          gh release view "v$VERSION" --json url,isPrerelease,assets -q '.url + " prerelease=" + (.isPrerelease|tostring) + " assets=" + ([.assets[].name] | join(", "))'

      - name: Dry-run summary
        if: steps.version.outputs.publish != 'true'
        shell: bash
        run: |
          echo "Dry run: nothing published. Release body preview:" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
