name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow for tags so build steps live in one place.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon runner: darwin-arm64 prebuild
            label: macOS arm64
            pack: npm run pack:mac
          - os: windows-latest # win32-x64 prebuild
            label: Windows x64
            pack: npm run dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build foreground identity module
        run: npm run build:native

      # Loads both native modules inside Electron and exits.
      # No global hooks, no synthetic keys; proves the prebuild matches this OS/arch/Electron.
      - name: Native module smoke test
        shell: bash
        run: |
          npx electron . --smoke-test 2>&1 | tee smoke.log
          grep -q COPICK_SMOKE_OK smoke.log

      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Signing activates automatically once these repository secrets exist;
          # empty secrets keep the unsigned build exactly as before.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A missing GitHub secret arrives as an empty string, and macOS packaging treats
          # an empty CSC_LINK as a certificate path (it only checks for null), which fails
          # the build. Treat empty exactly like absent.
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          [ -n "${WIN_CSC_LINK:-}" ] || unset WIN_CSC_LINK
          [ -n "${WIN_CSC_KEY_PASSWORD:-}" ] || unset WIN_CSC_KEY_PASSWORD
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID
          if [[ "$RUNNER_OS" == "macOS" && -n "${APPLE_ID:-}" ]]; then
            echo "Apple credentials present: notarization enabled"
            npm run pack:mac -- --config.mac.notarize=true
          else
            ${{ matrix.pack }}
          fi

      - name: Smoke test packaged app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            app=$(find release -maxdepth 3 -name 'Copick.app' -type d | head -1)
            bin="$app/Contents/MacOS/Copick"
          else
            bin=$(find release -maxdepth 3 -name 'Copick.exe' -type f | head -1)
          fi
          echo "binary: $bin"
          "$bin" --smoke-test 2>&1 | tee packaged-smoke.log || true
          grep -q COPICK_SMOKE_OK packaged-smoke.log

      # Silent-install the NSIS package into a scratch directory, smoke test the installed
      # binary, then run the generated uninstaller. Proves the installer and its uninstall path.
      - name: Install, launch-at-login and uninstall checks (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release -Filter 'Copick-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { Write-Error 'installer not found' }
          $target = Join-Path $env:RUNNER_TEMP 'copick-install'
          Write-Host "installer: $($setup.FullName) -> $target"
          # NSIS: /S silent install, /D=<dir> must be the last argument and unquoted.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $target 'Copick.exe'
          if (-not (Test-Path $exe)) { Write-Error 'installed Copick.exe missing' }
          $out = & $exe --smoke-test 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'COPICK_SMOKE_OK') { Write-Error 'installed binary smoke test failed' }

          # Launch-at-login: seed a paused config so no hook or window starts, run the installed
          # app once, and verify it registers the HKCU Run entry for this user.
          $cfgDir = Join-Path $env:APPDATA 'Copick'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          '{"paused":true,"clipboardFallback":false,"launchAtLogin":true,"blacklist":[]}' |
            Set-Content -Path (Join-Path $cfgDir 'config.json') -Encoding utf8
          $appProc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $run = (reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v Copick 2>$null | Out-String)
          if (-not $run -match 'Copick') { Write-Error 'launchAtLogin did not register the HKCU Run entry' }
          Write-Host "Run entry: $($run.Trim())"
          Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
          Get-Process Copick -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Copick -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $cfgDir -ErrorAction SilentlyContinue

          $un = Start-Process -FilePath (Join-Path $target 'Uninstall Copick.exe') -ArgumentList '/S', "_?=$target" -Wait -PassThru
          if ($un.ExitCode -ne 0) { Write-Error "uninstaller exit code $($un.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { Write-Error 'uninstall left Copick.exe behind' }
          Write-Host 'installer, launch-at-login and uninstall checks OK'

      - uses: actions/upload-artifact@v7
        with:
          name: copick-${{ matrix.os }}
          path: |
            app/release/*.zip
            app/release/*.exe
            app/release/*.yml
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      # Runtime dependencies must be clean; dev tooling (electron-builder chain) is reported only.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies (informational)
        run: npm audit || true
