<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="settings.css"><title>Copick 设置</title></head>
<body><main>
<header><h1>Copick</h1><p>选中文字，点击复制。</p><span id="status">正在读取设置…</span></header>
<form id="settings">
<label class="toggle"><input id="paused" type="checkbox"><span>暂停划词</span></label>
<label class="toggle"><input id="fallback" type="checkbox"><span>启用快捷键回退</span></label>
<p class="help">取词失败时模拟复制，会临时改动剪贴板，也可能被剪贴板历史记录。</p>
<section><h2><label for="blacklist">应用黑名单</label></h2>
<p id="blacklist-help" class="help"></p>
<textarea id="blacklist" rows="3" spellcheck="false"></textarea>
<p id="recent" class="help"></p>
</section>
<section id="mac-accessibility" hidden>
<div class="permission-row"><span>辅助功能：<span id="accessibility-status"></span></span><button id="open-accessibility" class="secondary" type="button">打开设置</button></div>
<p id="accessibility-help" class="help" hidden>授权后自动恢复监听，无需重启。</p>
</section>
<div class="actions"><button type="submit">保存设置</button><span id="message" role="status" aria-live="polite"></span></div>
</form>
</main><script src="settings.js"></script></body></html>
